name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: CloudFormation template tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CloudFormation structural tests
        run: pytest tests/ -v

      - name: cfn-lint validate (extra belt + braces)
        run: |
          pip install cfn-lint
          cfn-lint template_broken.yaml || true   # broken is allowed to lint-warn
          cfn-lint template_fixed.yaml             # fixed must lint clean

      - name: Summarise
        if: always()
        run: |
          echo "### Activity 4 — cost optimisation checks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Template structure tests: see job log" >> $GITHUB_STEP_SUMMARY
          echo "- cfn-lint on fixed template: must pass" >> $GITHUB_STEP_SUMMARY
